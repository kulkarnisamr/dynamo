suite: namespace restriction webhook RBAC
templates:
  - charts/dynamo-operator/templates/webhook-rbac.yaml
tests:
  - it: gives cluster-wide API mutation permissions only to the cluster-wide operator
    asserts:
      - hasDocuments:
          count: 4

  - it: grants a namespaced operator read-only capability discovery
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: rules[0].verbs
          value:
            - list
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: rules[0].resources
          value:
            - validatingwebhookconfigurations
        documentSelector:
          path: kind
          value: ClusterRole
